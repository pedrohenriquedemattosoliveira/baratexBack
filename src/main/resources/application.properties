spring.application.name=baratex-api
server.port=${PORT:8080}

# Conexao com o banco (PostGIS). Em producao defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/baratex_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Exibir SQLs formatados
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

springdoc.packagesToScan=com.baratex.api.controller

# JWT (em producao defina JWT_SECRET com um valor proprio)
api.jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a210123456789abcdef9a8f7e6d5c4b3a210123456789abcdef}
api.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS: origens permitidas separadas por virgula (URL do front local e do Netlify)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}
